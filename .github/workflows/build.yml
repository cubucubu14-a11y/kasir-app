name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Buat project Flutter
        run: flutter create --org com.kasir --project-name kasir_app .

      - name: Pakai pubspec custom
        run: cp pubspec_custom.yaml pubspec.yaml

      - name: Copy main.dart
        run: cp main.dart lib/main.dart

      - name: Tambah izin INTERNET + BLUETOOTH
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' $MANIFEST; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $MANIFEST
          fi
          if ! grep -q 'android.permission.BLUETOOTH_CONNECT' $MANIFEST; then
            sed -i 's|<application|<uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30"/>\n    <application|' $MANIFEST
          fi

      - name: Paksa Kotlin Versi 2.0.0
        run: |
          if [ -f "android/settings.gradle" ]; then
            sed -i 's/org\.jetbrains\.kotlin\.android" version "[^"]*"/org.jetbrains.kotlin.android" version "2.0.0"/g' android/settings.gradle || true
          fi
          if [ -f "android/settings.gradle.kts" ]; then
            sed -i 's/org\.jetbrains\.kotlin\.android" version "[^"]*"/org.jetbrains.kotlin.android" version "2.0.0"/g' android/settings.gradle.kts || true
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Install ImageMagick (Untuk Convert Logo)
        run: sudo apt-get install -y imagemagick

      - name: Pasang Logo Aplikasi
        run: |
          # 1. Convert logo
          convert logo_kasir.jpg -resize 1024x1024 logo.png
          
          # 2. Install package logo (Hanya sekali lewat dev dependencies)
          flutter pub add --dev flutter_launcher_icons
          
          # 3. Tambahkan konfigurasi ke pubspec.yaml
          echo "" >> pubspec.yaml
          echo "flutter_launcher_icons:" >> pubspec.yaml
          echo "  android: true" >> pubspec.yaml
          echo "  image_path: \"logo.png\"" >> pubspec.yaml
          
          # 4. Jalankan perintah untuk membuat icon
          flutter pub run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kasir-apk
          path: build/app/outputs/flutter-apk/app-release.apk
