name: Generate Keystore (Run Once)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore kasir-key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias kasir-key \
            -storepass KasirToko2026! \
            -keypass KasirToko2026! \
            -dname "CN=Kasir App, OU=Owner, O=Toko, L=Jakarta, S=DKI, C=ID"

      - name: Convert ke base64
        run: |
          base64 -w 0 kasir-key.jks > keystore-base64.txt
          echo "=== Ukuran file ==="
          ls -lh kasir-key.jks keystore-base64.txt
          echo "=== Isi base64 (100 karakter pertama) ==="
          head -c 100 keystore-base64.txt
          echo ""

      - name: Upload keystore + base64
        uses: actions/upload-artifact@v4
        with:
          name: keystore-files
          path: |
            kasir-key.jks
            keystore-base64.txt
